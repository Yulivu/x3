# NEW_TASKS 06 queue.  U12R runs first; the U8 audit (A), the label-free local
# probe (P-LOCAL) and the SGM diagnostic (D1) are appended once their drivers
# exist.  U13/U14 are deliberately absent: NEW_TASKS 06 says not to re-run them.
version: 6
python: /root/miniconda3/bin/python
wps:
  - {id: U12R, tier: P0, lane: C, deps: [], est_h: 1.5, cmd: "/root/miniconda3/bin/python scripts/u12r_e0.py", outputs: ["results/u12r_e0.csv", "results/u12r_gate.json"]}
  - {id: A, tier: P0, lane: C, deps: [], est_h: 3.0, cmd: "/root/miniconda3/bin/python scripts/a_enroll_audit.py", outputs: ["results/a_enroll_audit.csv", "results/a_gate.json"]}
  # NEW_TASKS 07 section 1: enrolment-size curve m in {3,5,10,20,40}.  Reuses
  # the existing drivers with a different --ms, so it can run without new code.
  - {id: U12RB, tier: P0, lane: C, deps: [], est_h: 0.5, cmd: "/root/miniconda3/bin/python scripts/u12r_e0.py --ms 3,5,10,20,40 --out results/u12r_curve.csv", outputs: ["results/u12r_curve.csv"]}
  - {id: AB, tier: P0, lane: C, deps: [], est_h: 1.0, cmd: "/root/miniconda3/bin/python scripts/a_enroll_audit.py --ms 5,10,20,40 --out results/a_curve.csv", outputs: ["results/a_curve.csv"]}
  # NEW_TASKS 07 section 1: OC variants (o1/o3/centroid/Mahalanobis) + language
  # and platform x language sub-metrics.
  - {id: AOC, tier: P0, lane: C, deps: [], est_h: 2.0, cmd: "/root/miniconda3/bin/python scripts/a_oc_variants.py", outputs: ["results/a_oc_variants.csv"]}
  - {id: AOCM, tier: P0, lane: C, deps: [], est_h: 2.0, cmd: "/root/miniconda3/bin/python scripts/a_oc_variants.py --backbone mms-1b --out results/a_oc_variants_mms.csv", outputs: ["results/a_oc_variants_mms.csv"]}
  # NEW_TASKS 07 section 2.1: pseudo-enrolment (highest priority in W2-lite).
  - {id: PLB, tier: P0, lane: C, deps: [], est_h: 1.0, cmd: "/root/miniconda3/bin/python scripts/w2lite_pseudo.py", outputs: ["results/w2lite_pseudo.csv"]}
  - {id: PLBM, tier: P0, lane: C, deps: [], est_h: 1.0, cmd: "/root/miniconda3/bin/python scripts/w2lite_pseudo.py --backbone mms-1b --out results/w2lite_pseudo_mms.csv", outputs: ["results/w2lite_pseudo_mms.csv"]}
    # NEW_TASKS 07 section 2.2: enrolment-contamination robustness (gate G30).
  - {id: CONT, tier: P0, lane: C, deps: [], est_h: 2.0, cmd: "/root/miniconda3/bin/python scripts/w2lite_contam.py", outputs: ["results/w2lite_contam.csv", "results/w2lite_contam_gate.json"]}
  # NEW_TASKS 07 sections 2.3-2.5: E-norm-s, multi-backbone OC, LCM (gate G28).
  - {id: ENORM, tier: P0, lane: C, deps: [], est_h: 2.0, cmd: "/root/miniconda3/bin/python scripts/w2lite_enorm.py", outputs: ["results/w2lite_enorm.csv", "results/w2lite_enorm_gate.json"]}
  # OC metric stability: same scores, same mask, two implementations gave EER
  # 14.84 vs 28.75 with a 0.062 score delta.  Quantify the tie plateau before
  # any G28 re-judgement.
  - {id: TIE, tier: P0, lane: C, deps: [], est_h: 0.5, cmd: "/root/miniconda3/bin/python scripts/oc_tie_audit.py", outputs: ["results/oc_tie_audit.csv", "results/oc_tie_audit_summary.csv"]}
